# Build the static export and publish it to GitHub Pages.
#
# Pages is configured via "GitHub Actions" as the source (Settings → Pages),
# NOT the legacy "deploy from branch" mode — so there is no gh-pages branch to
# maintain and `out/` never gets committed.
#
# public/CNAME carries the apex domain into out/ on every build. Without it,
# Pages drops the custom domain on the next deploy and the site 404s.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a merge train
# still ends on the newest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
